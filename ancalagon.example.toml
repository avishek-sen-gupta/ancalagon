[workspace]
write_root = "./ws"
read_roots = ["./artifacts"]

[model]
name = "claude-opus-5"
num_retries = 3
request_timeout_s = 300
max_tokens = 8000
allowed_domains = ["bedrock-runtime.us-east-1.amazonaws.com"]

[budget]
turns = 20
tool_calls = 60

[limits]
max_concurrent_agents = 4
agent_timeout_s = 3600
max_depth = 1
# Old tool results are replaced by a pointer to the file they were written to,
# once the conversation passes this size. 0 disables it.
compact_above_tokens = 60000
keep_recent_messages = 8
summary_chars = 1000

[sandbox]
strategy = "fence"   # or "none"

[run]
run_dir = ""    # where this run lives; empty allocates the next write_root/runs/r_NNNN
goal_file = "./goal.md"  # the run's goal; required
contract_module = ""   # "shape.py"; empty means the built-in FreeText
contract_class = ""    # "Answer"; set with contract_module or not at all
