[workspace]
write_root = "./ws"
read_roots = ["./artifacts"]

[agent]
root_behaviour = """
You investigate a codebase or a set of artifacts to answer the goal you are given.
Read before concluding, and prefer evidence from the files over recall.
Delegate a focused subtask when a question is self-contained and you want it
answered in a shape you can rely on.
"""

[model]
name = "claude-opus-5"
num_retries = 3
request_timeout_s = 300
max_tokens = 8000

[budget]
turns = 20
tool_calls = 60

[limits]
max_concurrent_agents = 4
agent_timeout_s = 3600
max_depth = 1
# Old tool results are replaced by a pointer to the file they were written to,
# once the conversation passes this size. 0 disables it.
compact_above_tokens = 60000
keep_recent_messages = 8
summary_chars = 1000

[tools]
enabled = []

[run]
run_dir = ""    # where this run lives; empty allocates the next write_root/runs/r_NNNN
goal_file = ""  # empty means the goal comes from --goal
contract = ""   # "path.py:ClassName"; empty means FreeText
