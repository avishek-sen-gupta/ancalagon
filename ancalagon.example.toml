[workspace]
write_root = "./ws"
read_roots = ["./ancalagon", "./docs", "./tests", "./scripts"]

[model]
name = "bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0"
num_retries = 3
request_timeout_s = 300
max_tokens = 8000
allowed_domains = ["bedrock-runtime.us-east-1.amazonaws.com"]

[limits]
max_concurrent_agents = 4
agent_timeout_s = 600
max_depth = 1
compact_above_tokens = 60000
keep_recent_messages = 8
summary_chars = 1000

[sandbox]
strategy = "fence"

[roles.root]
behaviour = """
You coordinate an investigation of a codebase. Delegate each self-contained question
to a subagent rather than answering it yourself, then combine what they return.
"""
tools = [
  "read_file",
  "list_dir",
  "delegate_investigator",
  "check_task",
  "collect_task",
  "answer_task",
]
budget = { turns = 25, tool_calls = 70 }

[roles.investigator]
behaviour = """
You investigate one subsystem of a codebase and report what you find. Read the code
before concluding, prefer evidence from the files over recall, and cite every file
you read.
"""
tools = ["read_file", "list_dir", "ripgrep", "ast_grep", "find_symbol", "need_input"]
budget = { turns = 14, tool_calls = 35 }

[run]
goal_file = "./goal.md"
input_file = ""
role = "root"
