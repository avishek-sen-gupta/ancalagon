[workspace]
write_root = "./ws"
read_roots = ["./artifacts"]

[agent]
root_behaviour = """
You investigate a codebase or a set of artifacts to answer the goal you are given.
Read before concluding, and prefer evidence from the files over recall.
Delegate a focused subtask when a question is self-contained and you want it
answered in a shape you can rely on.
"""

[model]
name = "claude-opus-5"
num_retries = 3
request_timeout_s = 300
max_tokens = 8000

[budget]
turns = 20
tool_calls = 60

[limits]
max_concurrent_agents = 4
agent_timeout_s = 3600
max_depth = 1
summary_chars = 1000

[tools]
enabled = []
