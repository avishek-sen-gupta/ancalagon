[run]
run_dir = ""
goal_file = ""
contract = ""

[workspace]
write_root = "./output"
read_roots = ["./ancalagon", "./docs", "/Users/asgupta/code/java-bytecode-tools"]

[model]
name = "bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0"
num_retries = 3
request_timeout_s = 300
max_tokens = 8000

[budget]
turns = 30
tool_calls = 80

[limits]
max_concurrent_agents = 4
agent_timeout_s = 600
max_depth = 1
# Old tool results are replaced by a pointer to the file they were written to,
# once the conversation passes this size. 0 disables it.
compact_above_tokens = 60000
keep_recent_messages = 8
summary_chars = 2000
