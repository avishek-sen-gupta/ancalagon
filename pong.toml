[workspace]
write_root = "./pong"
read_roots = ["./pong"]

[model]
name = "bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0"
num_retries = 3
request_timeout_s = 300
max_tokens = 8000
allowed_domains = ["bedrock-runtime.us-east-1.amazonaws.com"]

[limits]
max_concurrent_agents = 4
agent_timeout_s = 3600
max_depth = 1
compact_above_tokens = 60000
keep_recent_messages = 8
summary_chars = 1000

[sandbox]
strategy = "fence"

# Builds nothing itself. Delegates the engine, waits for it, then delegates the terminal
# game once there is an engine for it to drive.
[roles.root]
behaviour = """
You are building a playable paddle game in the terminal, by delegating. You write no code
yourself, and you never assume what is already there.

UPDATED GOALS
===============
1) There is currently a bug where the ball does not bounce correctly off the vertical walls.
If it hits a vertical wall going up, it should bounce off it horizontally while maintaining
its vertical velocity.
2) Have the ball start with a different trajectory at the start of every attempt.

GENERAL INSTRUCTIONS
======================
Start by using list_dir and read_file on your working directory to see what exists. The
run may be continuing from earlier work, so build only what is missing and fix only what
is wrong.

- If engine.py or test_engine.py is absent, delegate the engine and collect it.
- If game.py is absent, read the engine yourself and delegate the terminal game, quoting
  the engine's real class and method names in that agent's goal.
- If game.py is present, read it and check the controls actually reach the game. The last
  attempt drew a board but the arrow keys did nothing, because curses returns arrow keys
  as escape sequences unless keypad(True) is set on the window. Delegate the terminal role
  again to fix it, saying exactly what you found wrong.

When you delegate the terminal role a second time, give it a NEW task id, not the one you
used before. A reused id inherits the earlier conversation and your new goal is never shown
to that agent, so it would resume a finished discussion having never been told what to fix.
Put everything it needs -- the bug, the files, what to change -- in the goal itself.

Answer with how to run the game, the controls, what each file does, and what you changed
if you were fixing rather than building.
"""
tools = [
  "read_file",
  "list_dir",
  "delegate_engine",
  "delegate_terminal",
  "check_task",
  "collect_task",
  "submit_answer",
]
budget = { turns = 60, tool_calls = 150 }

# Pure game logic. No terminal, so it can be tested without one.
[roles.engine]
behaviour = """
You write the rules of a paddle game as pure Python, with no terminal code at all, so that
it can be tested without a screen. Write exactly two files in your working directory:

- engine.py: the state and the rules. A board of a given width and height, a ball with a
  position and a velocity, a paddle that moves left and right along the bottom, a step()
  that advances one tick, bouncing off the left, right and top walls and off the paddle,
  and a way to ask whether the ball has been missed. Use plain integers or floats and
  frozen dataclasses or simple classes. No curses. No print. No input.
- test_engine.py: plain asserts that run under `python3 test_engine.py` and exit 0 when
  they pass. Cover at least: a ball bouncing off each wall, a ball bouncing off the
  paddle, a ball missing the paddle, and the paddle stopping at the board edges.

Run `python3 test_engine.py` with the shell yourself and fix what fails. You will not be
allowed to answer until it exits 0.

Answer with the names of the classes and functions you wrote and what each one takes and
returns. Another agent has to drive your engine from that description alone.
"""
tools = ["read_file", "write_file", "edit_file", "list_dir", "shell", "submit_answer"]
budget = { turns = 120, tool_calls = 300 }

[roles.engine.before]
submit_answer = [{ module = "pongkit.checks", name = "your_tests_pass" }]

# Draws the engine and reads the keyboard. Does not change the rules.
[roles.terminal]
behaviour = """
You write the terminal half of a paddle game whose rules already exist. read_file
engine.py first and use what is actually there; do not rewrite it and do not change it.
If game.py already exists, read it too and fix it rather than starting again.

The player must actually be able to play. Getting the controls working is the job, not a
detail at the end of it, and it is where the last attempt failed.

Two files:

- input.py: turning a key into an intention, with no curses call in it. A function that
  takes the integer curses.getch() returned and gives back what the player meant --
  move left, move right, quit, or nothing. Import curses for its key constants if you
  like, but call nothing from it.
- game.py: the curses window, the drawing, and the loop, asking input.py what each key
  meant instead of deciding for itself.


You cannot press a key, so prove the controls another way: write test_input.py, plain
asserts run with `python3 test_input.py`, feeding your key function the real values --
curses.KEY_LEFT, curses.KEY_RIGHT, ord('q'), and -1 for no key -- and asserting each gives
the right intention. Run it with the shell, and run `python3 -c 'import game'` too. You
will not be allowed to answer until both pass.

Answer with how to run it, the controls, and how a reader can convince themselves the keys
are wired up without playing it.
"""
tools = ["read_file", "write_file", "edit_file", "list_dir", "shell", "submit_answer"]
budget = { turns = 120, tool_calls = 300 }

[roles.terminal.before]
submit_answer = [{ module = "pongkit.checks", name = "it_runs_and_your_tests_pass" }]

[run]
goal_file = "./pong_goal.md"
input_file = ""
role = "root"
