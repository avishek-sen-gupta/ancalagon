[project]
name = "ancalagon"
version = "0.1.0"
description = "Agent harness for reverse engineering"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12",
    "litellm>=1.60",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tenacity>=8.0",
    "httpx[socks]>=0.27",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "pyright>=1.1.409",
    "boto3>=1.43.62",
    "import-linter>=2.13",
]

[project.scripts]
ancalagon = "ancalagon.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ancalagon"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "ancalagon"

[[tool.importlinter.contracts]]
name = "Layers point downward"
type = "layers"
layers = [
    "ancalagon.cli",
    "ancalagon.worker",
    "ancalagon.supervisor : ancalagon.session",
    "ancalagon.tools",
    "ancalagon.children",
    "ancalagon.answer",
    "ancalagon.bus",
    "ancalagon.attempt",
    "ancalagon.llm : ancalagon.transcript",
    "ancalagon.workspace",
    "ancalagon.config",
    "ancalagon.contracts : ancalagon.clock : ancalagon.sandbox",
    "ancalagon.migrations",
]

[[tool.importlinter.contracts]]
name = "Sibling leaves are independent"
type = "independence"
modules = [
    "ancalagon.contracts",
    "ancalagon.clock",
    "ancalagon.sandbox",
]
