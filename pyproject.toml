[project]
name = "ancalagon"
version = "0.1.0"
description = "Agent harness for reverse engineering"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12",
    "litellm>=1.60",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "pyright>=1.1.409",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ancalagon"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
