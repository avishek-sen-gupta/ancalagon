[project]
name = "ancalagon"
version = "0.1.0"
description = "Agent harness for reverse engineering"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12",
    "litellm>=1.60",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tenacity>=8.0",
    "httpx[socks]>=0.27",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "pyright>=1.1.409",
    "boto3>=1.43.62",
    "import-linter>=2.13",
]

[project.scripts]
ancalagon = "ancalagon.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ancalagon"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "ancalagon"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers point downward"
type = "layers"
layers = [
    "ancalagon.cli",
    "ancalagon.worker",
    "ancalagon.supervisor : ancalagon.session",
    "ancalagon.tools",
    "ancalagon.children",
    "ancalagon.answer",
    "ancalagon.bus",
    "ancalagon.schedule",
    "ancalagon.attempt",
    "ancalagon.llm : ancalagon.transcript",
    "ancalagon.workspace",
    "ancalagon.config",
    "ancalagon.contracts : ancalagon.clock : ancalagon.sandbox",
    "ancalagon.migrations",
    "ancalagon.env : ancalagon.fs",
]

[[tool.importlinter.contracts]]
name = "Sibling leaves are independent"
type = "independence"
modules = [
    "ancalagon.contracts",
    "ancalagon.clock",
    "ancalagon.env",
    "ancalagon.fs",
]

[[tool.importlinter.contracts]]
name = "The sandbox knows the file system and nothing else of ours"
type = "forbidden"
source_modules = ["ancalagon.sandbox"]
forbidden_modules = [
    "ancalagon.clock",
    "ancalagon.contracts",
    "ancalagon.env",
]

[[tool.importlinter.contracts]]
name = "Tools that take a model's path go through the workspace"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "ancalagon.tools.artifacts",
    "ancalagon.tools.files",
    "ancalagon.tools.history",
    "ancalagon.tools.parse",
    "ancalagon.tools.registry",
    "ancalagon.tools.search",
    "ancalagon.tools.survey",
]
forbidden_modules = ["ancalagon.fs"]

[[tool.importlinter.contracts]]
name = "Domain does not import adapters"
type = "forbidden"
source_modules = ["ancalagon.attempt", "ancalagon.schedule"]
forbidden_modules = ["ancalagon.bus"]

[[tool.importlinter.contracts]]
name = "SQL stays in the adapters"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "ancalagon.answer",
    "ancalagon.answer_command",
    "ancalagon.attempt",
    "ancalagon.children",
    "ancalagon.cli",
    "ancalagon.clock",
    "ancalagon.config",
    "ancalagon.contracts",
    "ancalagon.env",
    "ancalagon.fs",
    "ancalagon.llm",
    "ancalagon.migrate_command",
    "ancalagon.sandbox",
    "ancalagon.schedule",
    "ancalagon.session",
    "ancalagon.supervisor",
    "ancalagon.tools",
    "ancalagon.transcript",
    "ancalagon.worker",
    "ancalagon.workspace",
]
forbidden_modules = ["sqlite3", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "The process is reached only by the adapters that own it"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "ancalagon.answer",
    "ancalagon.answer_command",
    "ancalagon.attempt",
    "ancalagon.bus",
    "ancalagon.children",
    "ancalagon.cli",
    "ancalagon.clock",
    "ancalagon.config",
    "ancalagon.contracts",
    "ancalagon.env",
    "ancalagon.fs",
    "ancalagon.llm",
    "ancalagon.migrations",
    "ancalagon.migrate_command",
    "ancalagon.sandbox",
    "ancalagon.schedule",
    "ancalagon.session",
    "ancalagon.supervisor",
    "ancalagon.tools",
    "ancalagon.transcript",
    "ancalagon.worker",
    "ancalagon.workspace",
]
forbidden_modules = ["os"]
ignore_imports = [
    "ancalagon.env.real_environment -> os",
    "ancalagon.supervisor.os_liveness -> os",
]
